{% if form.non_field_errors %}
  <div class="form-errors" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
      <div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
    {% endif %}
    {% if field.errors %}
      <ul class="field-errors" id="{{ field.auto_id }}_error">
        {% for error in field.errors %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
{% endfor %}
